name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Test-only key. Never reuse this value outside CI.
      SECRET_KEY: "ci-only-secret-key-for-tests-not-for-production-42"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pydantic-settings pytest pytest-asyncio httpx "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==4.0.1"

      - name: Run tests
        run: |
          pytest tests/unit/ -v
